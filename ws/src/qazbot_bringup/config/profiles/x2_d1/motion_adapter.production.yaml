# x2_motion_adapter, profile x2_d1, mode production: LIVE MC output (/aima/mc/locomotion/velocity) after
# SetMcInputSource registration (AimDK 5.1.3: SDK input source priority range 20..39).
# Based on the live cmdline of 2026-11-05 (pid 187287): -p live:=true -p priority:=30 -p odom_topic:=/qazbot_lio/odom_level.
# registration_action: was ENABLE (valid only for a restart inside a boot that already had an ADD; failed with code=1 on
# the first start after every reboot, T4 2026-11-06). Now add_then_enable (the only accepted value; AimDK 5.1.3 + official
# example mc_locomotion_velocity.py): registration runs automatically once at start. Everything else: code defaults.
/qazbot_d1_map/motion_adapter:
  ros__parameters:
    live: true
    priority: 30
    registration_action: add_then_enable
    odom_topic: /qazbot_lio/odom_level
