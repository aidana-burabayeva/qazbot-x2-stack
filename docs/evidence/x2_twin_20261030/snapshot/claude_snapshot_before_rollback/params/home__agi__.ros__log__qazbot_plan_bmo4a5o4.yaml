/qazbot_d1_map/nav2/bt_navigator:
  ros__parameters:
    default_nav_through_poses_bt_xml: /home/agi/control_backend/ws/src/navigation/bt/unsupported_through_poses.xml
    default_nav_to_pose_bt_xml: /home/agi/control_backend/ws/src/navigation/bt/navigate_to_pose.xml
    default_server_timeout: 500
    global_frame: map
    odom_topic: /qazbot_native/odom
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_rate_controller_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_recovery_node_bt_node
    - nav2_clear_costmap_service_bt_node
    robot_base_frame: base_footprint
    use_sim_time: false
/qazbot_d1_map/nav2/global_costmap/global_costmap:
  ros__parameters:
    footprint: '[[0.17, 0.229], [0.008, 0.34], [-0.182, 0.34], [-0.305, 0.229], [-0.305,
      -0.261], [-0.182, -0.372], [0.008, -0.372], [0.17, -0.261]]'
    footprint_padding: 0.04535533958616298
    global_frame: map
    inflation_layer.cost_scaling_factor: 1.5
    inflation_layer.inflate_around_unknown: true
    inflation_layer.inflation_radius: 0.6
    inflation_layer.plugin: nav2_costmap_2d::InflationLayer
    obstacle_layer.bounded_rays.clearing: true
    obstacle_layer.bounded_rays.data_type: PointCloud2
    obstacle_layer.bounded_rays.marking: false
    obstacle_layer.bounded_rays.raytrace_max_range: 3.5
    obstacle_layer.bounded_rays.topic: /qazbot_lio/scan_clearing
    obstacle_layer.observation_sources: scan bounded_rays
    obstacle_layer.plugin: nav2_costmap_2d::ObstacleLayer
    obstacle_layer.scan.clearing: false
    obstacle_layer.scan.data_type: PointCloud2
    obstacle_layer.scan.inf_is_valid: false
    obstacle_layer.scan.marking: true
    obstacle_layer.scan.obstacle_max_range: 3.0
    obstacle_layer.scan.raytrace_max_range: 3.5
    obstacle_layer.scan.topic: /qazbot_lio/scan_obstacles
    plugins:
    - static_layer
    - obstacle_layer
    - inflation_layer
    robot_base_frame: base_footprint
    static_layer.footprint_clearing_enabled: true
    static_layer.map_subscribe_transient_local: true
    static_layer.map_topic: /qazbot_d1_map/map
    static_layer.plugin: nav2_costmap_2d::StaticLayer
    track_unknown_space: true
    use_sim_time: false
/qazbot_d1_map/nav2/planner_server:
  ros__parameters:
    GridBased.allow_unknown: false
    GridBased.cost_travel_multiplier: 4.0
    GridBased.plugin: nav2_smac_planner/SmacPlanner2D
    GridBased.tolerance: 0.3
    planner_plugins:
    - GridBased
    use_sim_time: false
