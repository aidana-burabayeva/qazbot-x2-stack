/qazbot_d1_map/nav2/controller_server:
  ros__parameters:
    FollowPath.allow_reversing: false
    FollowPath.approach_velocity_scaling_dist: 0.6
    FollowPath.desired_linear_vel: 0.3
    FollowPath.lookahead_dist: 0.5
    FollowPath.lookahead_time: 1.5
    FollowPath.max_allowed_time_to_collision_up_to_carrot: 1.5
    FollowPath.max_angular_accel: 1.0
    FollowPath.max_lookahead_dist: 0.9
    FollowPath.min_approach_linear_velocity: 0.12
    FollowPath.min_lookahead_dist: 0.3
    FollowPath.plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
    FollowPath.regulated_linear_scaling_min_radius: 0.9
    FollowPath.regulated_linear_scaling_min_speed: 0.15
    FollowPath.rotate_to_heading_angular_vel: 0.5
    FollowPath.rotate_to_heading_min_angle: 0.6
    FollowPath.transform_tolerance: 0.2
    FollowPath.use_collision_detection: true
    FollowPath.use_cost_regulated_linear_velocity_scaling: false
    FollowPath.use_regulated_linear_velocity_scaling: true
    FollowPath.use_rotate_to_heading: true
    FollowPath.use_velocity_scaled_lookahead_dist: false
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    failure_tolerance: 0.3
    goal_checker.plugin: nav2_controller::SimpleGoalChecker
    goal_checker.stateful: true
    goal_checker.xy_goal_tolerance: 0.1
    goal_checker.yaw_goal_tolerance: 0.1
    goal_checker_plugins:
    - goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    odom_topic: /qazbot_lio/odom_level
    progress_checker.movement_time_allowance: 15.0
    progress_checker.plugin: nav2_controller::SimpleProgressChecker
    progress_checker.required_movement_radius: 0.1
    progress_checker_plugin: progress_checker
    use_sim_time: false
/qazbot_d1_map/nav2/local_costmap/local_costmap:
  ros__parameters:
    footprint_padding: 0.01
    global_frame: odom
    height: 4
    inflation_layer.cost_scaling_factor: 3.0
    inflation_layer.inflation_radius: 0.464
    inflation_layer.plugin: nav2_costmap_2d::InflationLayer
    obstacle_layer.observation_sources: scan
    obstacle_layer.plugin: nav2_costmap_2d::ObstacleLayer
    obstacle_layer.scan.clearing: true
    obstacle_layer.scan.data_type: LaserScan
    obstacle_layer.scan.marking: true
    obstacle_layer.scan.obstacle_max_range: 3.0
    obstacle_layer.scan.raytrace_max_range: 3.5
    obstacle_layer.scan.topic: /qazbot_lio/scan
    plugins:
    - obstacle_layer
    - inflation_layer
    publish_frequency: 2.0
    resolution: 0.05
    robot_base_frame: base_footprint
    robot_radius: 0.454
    rolling_window: true
    update_frequency: 5.0
    use_sim_time: false
    width: 4
/qazbot_d1_map/nav2/velocity_smoother:
  ros__parameters:
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    feedback: OPEN_LOOP
    max_accel:
    - 0.4
    - 0.0
    - 1.0
    max_decel:
    - -0.6
    - 0.0
    - -1.5
    max_velocity:
    - 0.3
    - 0.0
    - 0.5
    min_velocity:
    - 0.0
    - 0.0
    - -0.5
    odom_duration: 0.1
    odom_topic: /qazbot_lio/odom_level
    scale_velocities: false
    smoothing_frequency: 20.0
    use_sim_time: false
    velocity_timeout: 0.5
