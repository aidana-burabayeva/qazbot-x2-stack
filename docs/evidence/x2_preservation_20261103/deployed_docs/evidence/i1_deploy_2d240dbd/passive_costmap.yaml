{
  "/**": {
    "ros__parameters": {
      "global_frame": "odom",
      "robot_base_frame": "base_footprint",
      "rolling_window": true,
      "width": 4,
      "height": 4,
      "resolution": 0.05,
      "robot_radius": 0.454,
      "footprint_padding": 0.01,
      "update_frequency": 5.0,
      "publish_frequency": 2.0,
      "always_send_full_costmap": true,
      "plugins": [
        "obstacle_layer",
        "inflation_layer"
      ],
      "inflation_layer.plugin": "nav2_costmap_2d::InflationLayer",
      "inflation_layer.inflation_radius": 0.464,
      "inflation_layer.cost_scaling_factor": 3.0,
      "obstacle_layer.plugin": "nav2_costmap_2d::ObstacleLayer",
      "obstacle_layer.observation_sources": "scan bounded_rays",
      "obstacle_layer.scan.topic": "/qazbot_lio/scan_obstacles",
      "obstacle_layer.scan.data_type": "PointCloud2",
      "obstacle_layer.scan.marking": true,
      "obstacle_layer.scan.clearing": false,
      "obstacle_layer.scan.inf_is_valid": false,
      "obstacle_layer.scan.obstacle_max_range": 3.0,
      "obstacle_layer.scan.raytrace_max_range": 3.5,
      "obstacle_layer.bounded_rays.topic": "/qazbot_lio/scan_clearing",
      "obstacle_layer.bounded_rays.data_type": "PointCloud2",
      "obstacle_layer.bounded_rays.marking": false,
      "obstacle_layer.bounded_rays.clearing": true,
      "obstacle_layer.bounded_rays.raytrace_max_range": 3.5
    }
  }
}